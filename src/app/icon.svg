<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9d95ff"/>
      <stop offset="60%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#5147e5"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer radar ring -->
  <circle cx="32" cy="32" r="28" fill="#6c63ff" fill-opacity="0.15" stroke="#6c63ff" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- Middle ring -->
  <circle cx="32" cy="32" r="19" fill="#6c63ff" fill-opacity="0.25" stroke="#6c63ff" stroke-opacity="0.5" stroke-width="1.8"/>
  <!-- Center pulse dot with gradient & glow -->
  <circle cx="32" cy="32" r="9.5" fill="url(#dotGrad)" filter="url(#glow)"/>
</svg>
